[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lqg-scattering"
version = "0.1.0"
description = "Reusable numerical tools for the LQG scattering research code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.15", "sympy>=1.14"]

[project.optional-dependencies]
visualization = ["matplotlib>=3.10", "Pillow>=12"]

[tool.setuptools]
packages = ["lqg_scattering"]
py-modules = ["coherent_states", "correspondence", "grassmannian", "minkowski", "positivity", "sparse_schwinger"]
