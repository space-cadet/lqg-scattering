<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" role="img" aria-labelledby="title desc">
<title id="title">Positive volume versus FL area label</title>
<desc id="desc">Regular tetrahedron fixed-area state sweep. RS and AL positive volume expectations increase with area label J from zero at J equals 1 through J equals 5.</desc>
