  - 'heading "Few-rotor transfer: planar bound and 3D controls" [level=1] [ref=f2e6]'
  - paragraph [ref=f2e7]: Six representative planar-pair ratios sample the exact pendulum bound and its numerical check. Three-dimensional zero-angular-momentum controls use seed 1701 across a triangle, open four-rotor chain and four-rotor ring at seven couplings. The common chart parameter is initial packet energy divided by coupling; series keep rotor count, topology and preparation separate.
