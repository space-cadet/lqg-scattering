  - heading "Exact-singlet geometric area redistribution (NS39–NS40)" [level=1] [ref=f7e6]
  - paragraph [ref=f7e7]: Fifty-four K=4 exact-singlet trajectories compare L=4,6,8 rings and complete graphs at alpha=0,1,5. The 54 case summaries are grouped in the chart by size, graph and preparation, with one point per coupling. The package also includes 270 selected geometry samples and the post-run permutation selection rule recorded as NS40.
