  - heading "Quantum planar-rotor transfer at zero total momentum (NS37)" [level=1] [ref=f4e6]
  - paragraph [ref=f4e7]: Two four-rotor ring preparations start in |m,-m,0,0| with exactly zero total momentum. Each row compares the saved late-window cold-pair kinetic fraction with an independent classical ensemble and reports the quantum single-rotor entropy for the initially energetic pair, initially cold pair, and all four sites.
