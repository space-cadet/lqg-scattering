          - paragraph [ref=f4e141]:
            - text: The
            - link "Hamiltonian study" [ref=f4e142] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/hamiltonian-studies.txt
            - text: supplies the underlying spectral and operator calculations. The last section of the
            - link "redistribution note" [ref=f4e143] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/geometric-area-redistribution.txt#recovering-face-directions
            - text: "sets out the next geometric question: when do the occupied channels support additional distinct face normals, and how sharply is a classical shape defined?"
