          - 'heading "Quantum geometry: a guide to the research notes" [level=1] [ref=f4e112]'
          - paragraph [ref=f4e113]:
            - text: The central physical question is how quantum face degrees of freedom form a closed geometry, how that geometry changes under interactions, and how area, energy and entanglement are shared. The notes approach this question from several directions. This page gives a reading route; the
            - link "numerical chronology" [ref=f4e114] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/numerical-studies.txt
            - text: gives the dated calculation record.
          - heading "Begin with states and geometry" [level=2] [ref=f4e115]
          - paragraph [ref=f4e116]:
            - text: The
            - link "published-paper overview" [ref=f4e117] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/published-paper-overview.txt
            - text: introduces the oscillator construction and its relation to scattering data. The
            - link "state-space probes" [ref=f4e118] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/state-space-probes.txt
            - text: explain the different bases and prepared states used in subsequent calculations.
          - paragraph [ref=f4e119]:
            - text: For a geometric picture, begin with
            - link "volume studies" [ref=f4e120] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/volume-studies.txt
            - text: and
            - link "the geometric interpretation of Hamiltonian states" [ref=f4e121] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/t11-geometric-interpretation.txt
            - text: . They connect closure, local areas, flux correlations and positive volume. The
            - link "regular/unequal-shape calculation log" [ref=f4e122] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/experiments/fl_volume_shape_scan_log.txt
            - text: records the associated coherent-state scans. The
            - link "illustration collection" [ref=f4e123] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/figures/physical-illustrations/README.txt
            - text: supplies visual explanations of the principal models.
          - heading "Follow energy and area as they spread" [level=2] [ref=f4e124]
          - paragraph [ref=f4e125]: "The natural reading sequence is:"
          - list [ref=f4e126]:
            - listitem [ref=f4e127]:
              - link "Face activation and energy sharing" [ref=f4e128] [cursor=pointer]:
                - /url: http://127.0.0.1:8767/study-assets/notes/face-energy-equipartition.txt
              - text: ": a tetrahedral FL input, additional empty channels, free hopping and recurrence."
            - listitem [ref=f4e129]:
              - link "Classical rotor equilibration" [ref=f4e130] [cursor=pointer]:
                - /url: http://127.0.0.1:8767/study-assets/notes/classical-rotor-equilibration.txt
              - text: ": concentrated kinetic energy spreading through interacting rotors, with an equilibrium comparison."
            - listitem [ref=f4e131]:
              - link "Few-rotor transfer" [ref=f4e132] [cursor=pointer]:
                - /url: http://127.0.0.1:8767/study-assets/notes/few-rotor-energy-transfer.txt
              - text: ": the exact planar-pair mechanism and the role of zero total angular momentum."
            - listitem [ref=f4e133]:
              - link "Coupling crossover and delayed release" [ref=f4e134] [cursor=pointer]:
                - /url: http://127.0.0.1:8767/study-assets/notes/rotor-coupling-crossover.txt
              - text: ": how coupling and observation time affect transfer in larger classical rings."
            - listitem [ref=f4e135]:
              - link "Four quantum planar rotors" [ref=f4e136] [cursor=pointer]:
                - /url: "#note-quantum-planar-rotor-energy-transfer"
              - text: ": a zero-total-momentum energetic pair and two initially cold receivers."
            - listitem [ref=f4e137]:
