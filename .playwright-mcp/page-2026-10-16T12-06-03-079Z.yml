            - text: . The
            - link "two-polyhedron exchange specification" [ref=f4e150] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/t9a-singlet-exchange.txt
            - text: records the implemented Hamiltonian, preparations, currents and reservoir extension.
