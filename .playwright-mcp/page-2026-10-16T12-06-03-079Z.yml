            - text: "is the physical entry point: increasing occupation, the role of closure, projected geometry and exchange between two closed subsystems."
          - paragraph [ref=f4e147]:
            - text: The construction is developed in
            - link "thermal area sectors" [ref=f4e148] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/thermal-area-sectors.txt
            - text: ", including the squeezed-state coefficients and appendices. Its reduced-state spectrum and entropy are explained in"
