  - paragraph [ref=f1e7]: Grouped late-time summaries compare four ring sizes, three packet-energy scales and fixed-packet versus fixed-density preparation. At packet energy 10, the hot-pair fraction follows the microcanonical value 2/N and equilibrium-region residence is 87.2–90.4%. At packet energy 100, the hot pair retains 98.7–99.0% of local energy through t=2000.
