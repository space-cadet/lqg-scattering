          - 'heading "Quantum geometry: a guide to the research notes" [level=1] [ref=f3e2708]'
          - paragraph [ref=f3e2709]:
            - text: The central physical question is how quantum face degrees of freedom form a closed geometry, how that geometry changes under interactions, and how area, energy and entanglement are shared. The notes approach this question from several directions. This page gives a reading route; the
            - link "numerical chronology" [ref=f3e2710] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/numerical-studies.txt
            - text: gives the dated calculation record.
          - heading "Begin with states and geometry" [level=2] [ref=f3e2711]
          - paragraph [ref=f3e2712]:
            - text: The
            - link "published-paper overview" [ref=f3e2713] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/published-paper-overview.txt
            - text: introduces the oscillator construction and its relation to scattering data. The
            - link "state-space probes" [ref=f3e2714] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/state-space-probes.txt
            - text: explain the different bases and prepared states used in subsequent calculations.
          - paragraph [ref=f3e2715]:
            - text: For a geometric picture, begin with
            - link "volume studies" [ref=f3e2716] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/volume-studies.txt
            - text: and
            - link "the geometric interpretation of Hamiltonian states" [ref=f3e2717] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/t11-geometric-interpretation.txt
            - text: . They connect closure, local areas, flux correlations and positive volume. The
            - link "regular/unequal-shape calculation log" [ref=f3e2718] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/experiments/fl_volume_shape_scan_log.txt
            - text: records the associated coherent-state scans. The
            - link "illustration collection" [ref=f3e2719] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/figures/physical-illustrations/README.txt
            - text: supplies visual explanations of the principal models.
          - heading "Follow energy and area as they spread" [level=2] [ref=f3e2720]
          - paragraph [ref=f3e2721]: "The natural reading sequence is:"
          - list [ref=f3e2722]:
            - listitem [ref=f3e2723]:
              - link "Face activation and energy sharing" [ref=f3e2724] [cursor=pointer]:
                - /url: http://127.0.0.1:8767/study-assets/notes/face-energy-equipartition.txt
              - text: ": a tetrahedral FL input, additional empty channels, free hopping and recurrence."
            - listitem [ref=f3e2725]:
              - link "Classical rotor equilibration" [ref=f3e2726] [cursor=pointer]:
                - /url: http://127.0.0.1:8767/study-assets/notes/classical-rotor-equilibration.txt
              - text: ": concentrated kinetic energy spreading through interacting rotors, with an equilibrium comparison."
            - listitem [ref=f3e2727]:
              - link "Few-rotor transfer" [ref=f3e2728] [cursor=pointer]:
                - /url: http://127.0.0.1:8767/study-assets/notes/few-rotor-energy-transfer.txt
              - text: ": the exact planar-pair mechanism and the role of zero total angular momentum."
            - listitem [ref=f3e2729]:
              - link "Coupling crossover and delayed release" [ref=f3e2730] [cursor=pointer]:
                - /url: http://127.0.0.1:8767/study-assets/notes/rotor-coupling-crossover.txt
              - text: ": how coupling and observation time affect transfer in larger classical rings."
            - listitem [ref=f3e2731]:
              - link "Four quantum planar rotors" [ref=f3e2732] [cursor=pointer]:
                - /url: http://127.0.0.1:8767/study-assets/notes/quantum-planar-rotor-energy-transfer.txt
              - text: ": a zero-total-momentum energetic pair and two initially cold receivers."
            - listitem [ref=f3e2733]:
              - link "Hamiltonian connectivity" [ref=f3e2734] [cursor=pointer]:
                - /url: "#note-face-activation-connectivity"
              - text: ": explicit four-to-five-to-six channel transitions with and without geometric closure."
            - listitem [ref=f3e2735]:
              - link "Geometric area redistribution" [ref=f3e2736] [cursor=pointer]:
                - /url: http://127.0.0.1:8767/study-assets/notes/geometric-area-redistribution.txt
              - text: ": actual closed-state dynamics with four, six and eight available channels, followed by volume, angular and entanglement readouts."
          - paragraph [ref=f3e2737]:
            - text: The
            - link "Hamiltonian study" [ref=f3e2738] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/hamiltonian-studies.txt
            - text: supplies the underlying spectral and operator calculations. The last section of the
            - link "redistribution note" [ref=f3e2739] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/geometric-area-redistribution.txt#recovering-face-directions
            - text: "sets out the next geometric question: when do the occupied channels support additional distinct face normals, and how sharply is a classical shape defined?"
          - heading "Temperature, closure and entanglement" [level=2] [ref=f3e2740]
          - paragraph [ref=f3e2741]:
            - link "Heating closed quantum geometry" [ref=f3e2742] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/thermal-geometry-and-singlet-exchange.txt
            - text: "is the physical entry point: increasing occupation, the role of closure, projected geometry and exchange between two closed subsystems."
          - paragraph [ref=f3e2743]:
            - text: The construction is developed in
            - link "thermal area sectors" [ref=f3e2744] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/thermal-area-sectors.txt
            - text: ", including the squeezed-state coefficients and appendices. Its reduced-state spectrum and entropy are explained in"
            - link "thermal entanglement" [ref=f3e2745] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/thermal-entanglement.txt
            - text: . The
            - link "two-polyhedron exchange specification" [ref=f3e2746] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/t9a-singlet-exchange.txt
            - text: records the implemented Hamiltonian, preparations, currents and reservoir extension.
          - heading "Joining and separating geometric systems" [level=2] [ref=f3e2747]
          - paragraph [ref=f3e2748]:
            - link "Constructive sewing" [ref=f3e2749] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/constructive-sewing-probe.txt
            - text: builds invariant triangle, tetrahedral and joined exterior-boundary tensors.
            - link "Binding energy" [ref=f3e2750] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/binding-energy.txt
            - text: examines the Hamiltonian comparison between an intact system and a separated configuration. Sewing a boundary and transferring quanta between independently closed polyhedra are different constructions; the
            - link "exchange note" [ref=f3e2751] [cursor=pointer]:
              - /url: http://127.0.0.1:8767/study-assets/notes/t9a-singlet-exchange.txt
            - text: makes the latter precise.
