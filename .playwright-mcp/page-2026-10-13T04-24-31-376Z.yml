        - paragraph [ref=e136]: Exact diagonalization of the hopping-plus-on-site-repulsion operator H_G=-t Σ_(i,j)∈E_G(E_ij+E_ji)+(U/2)Σ_i n_i(n_i−1), where E_ij=a_i†a_j+b_i†b_j and n_i=a_i†a_i+b_i†b_i. Four sites, fixed boson number 2K and total spin zero; K=2,3,4 gives dimensions 20,50,105, with empty sites allowed. Compare the complete graph (6 hopping bonds) and periodic ring (4), with equal t per bond. The 30 cases use (t,U)=(0,1) or t=1 and U/t=0,1,5,20.
        - paragraph [ref=e137]: The positive Rovelli–Smolin (RS) volume V=(γℏ)^(3/2)Σ_(connected triples)√|q_ijk|, q_ijk=i[J_i·J_j,J_j·J_k], is a separate observable evaluated on energy eigenstates and Gibbs states; it is not a term in H_G, and no g_V V coupling was calculated. The optional spin-exchange setting is g=0. Both graphs select the same four connected triples, so V is the same operator and only the hopping graph changes. Project-normalized volume; physical calibration is open. The temperature response is a finite-sector crossover, not a phase transition. Ground-state entropy uses the Gibbs mixture when degenerate.
